[project]
name = "gabriel_rl_summative"
version = "0.1.0"
description = "NutriBridge CHW Planner: DQN vs REINFORCE vs PPO vs A2C (TorchRL) on a custom nutrition-support environment"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.3",
    "torchrl>=0.6",
    "tensordict>=0.6",
    "gymnasium>=0.29",
    "pygame>=2.5",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
